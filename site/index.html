<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Apegramma</title>
  <meta name="theme-color" content="#e8b423">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Apegramma</h1>
    <div id="grid" role="group" aria-label="Lettere della griglia, la quarta è la centrale"></div>
    <p id="status" role="status"></p>

    <section id="apegrammi" hidden>
      <h2>Apegrammi</h2>
      <div class="list"></div>
    </section>

    <section id="words"></section>

    <details id="corrections">
      <summary>Correzioni</summary>
      <form id="add-form">
        <label for="add-word">Aggiungi parola che manca</label>
        <div class="row">
          <input id="add-word" type="text" autocomplete="off" autocapitalize="none" spellcheck="false">
          <button type="submit">Aggiungi</button>
        </div>
      </form>
      <p id="corrections-message" role="status"></p>
      <ul id="corrections-list"></ul>
      <div class="row">
        <button type="button" id="export">Esporta correzioni</button>
        <label class="button" for="import">Importa correzioni</label>
        <input id="import" type="file" accept="application/json,.json" hidden>
      </div>
    </details>
  </main>

  <dialog id="word-menu">
    <h2 id="menu-word"></h2>
    <a id="menu-dictionary" class="button" target="_blank" rel="noopener">Controlla sul dizionario</a>
    <button type="button" id="menu-reject">Rifiutata dal gioco</button>
    <button type="button" id="menu-close">Chiudi</button>
  </dialog>

  <footer>
    <p>Elenco non ufficiale: può differire da quello del gioco del Corriere della Sera.</p>
    <p>
      Lessico: <a href="https://docs.sslmit.unibo.it/doku.php?id=resources:morph-it" rel="noopener">Morph-it!</a>
      di Marco Baroni ed Eros Zanchetta, filtrato per questa app, con licenza
      <a href="https://creativecommons.org/licenses/by-sa/2.0/" rel="noopener">CC BY-SA 2.0</a>.
    </p>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
